name: Check and publish website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip check
      - run: npm run check
      - run: npm run test:deploy
      - run: npm run test:backend
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:edgeone
      - run: npm run package:edgeone
      - run: npm run package:backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            artifacts/test-report
            artifacts/backend-test-report
            artifacts/edgeone-test-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: backend-source-package
          path: release/inex-backend-*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: edgeone-preview-package
          path: release/inex-edgeone-*.zip
          retention-days: 14
      - run: node scripts/prepare-pages.mjs
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: artifacts/github-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  edgeone-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance checked source for EdgeOne Git integration
        run: git push origin HEAD:refs/heads/edgeone-release
