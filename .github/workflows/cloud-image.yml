name: Build and verify cloud image

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: "Image repository without a tag (TCR personal: ccr.ccs.tencentyun.com/namespace/inex-api)"
        required: true
        default: inex-api
        type: string
      push_image:
        description: "Push the verified image to TCR (requires TCR_USERNAME and TCR_PASSWORD secrets)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Log in to TCR personal registry
        if: inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build, start and verify container before optional push
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          if [ "$PUSH_IMAGE" = "true" ]; then
            node scripts/cloud-image.mjs --image "$IMAGE_REPOSITORY" --push
          else
            node scripts/cloud-image.mjs --image "$IMAGE_REPOSITORY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: verified-cloud-image-record
          path: release/cloud-image-*.json
          if-no-files-found: error
          retention-days: 30
